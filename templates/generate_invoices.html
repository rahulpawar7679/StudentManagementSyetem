<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Issue Fee Invoices | Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --primary-blue: #0b63e5;
            --sidebar-dark: #004ecc;
            --bg-canvas: #f3f6fa;
            --card-border: #e2e8f0;
            --text-dark: #0f172a;
        }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg-canvas); color: var(--text-dark); margin: 0; }
        .app-layout { display: flex; min-height: 100vh; }
        .sidebar { width: 240px; background: linear-gradient(180deg, var(--primary-blue) 0%, var(--sidebar-dark) 100%); color: #fff; flex-shrink: 0; padding: 20px 14px; display: flex; flex-direction: column; }
        .brand-box { display: flex; align-items: center; gap: 10px; padding: 8px 10px 24px; font-size: 1.1rem; font-weight: 800; }
        .brand-icon { width: 34px; height: 34px; background: #fff; color: var(--primary-blue); border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; }
        .nav-item-link { display: flex; align-items: center; gap: 10px; padding: 9px 12px; color: rgba(255,255,255,0.85); text-decoration: none; font-size: 0.84rem; font-weight: 500; border-radius: 8px; margin-bottom: 2px; }
        .nav-item-link:hover, .nav-item-link.active { background: rgba(255,255,255,0.2); color: #fff; }
        .workspace { flex-grow: 1; display: flex; flex-direction: column; min-width: 0; }
        .top-bar { height: 64px; background: #fff; border-bottom: 1px solid var(--card-border); display: flex; align-items: center; justify-content: space-between; padding: 0 32px; }
        .content-area { padding: 24px 32px; }
        .panel-card { background: #fff; border: 1px solid var(--card-border); border-radius: 14px; padding: 24px; box-shadow: 0 1px 2px rgba(0,0,0,0.02); max-width: 600px; margin: 0 auto; }
        .btn-saas-primary { background: #10b981; color: #fff; border: none; font-weight: 600; padding: 10px 20px; border-radius: 8px; }
        .btn-saas-primary:hover { background: #059669; color: #fff; }
    </style>
</head>
<body>

<div class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="brand-box">
            <div class="brand-icon"><i class="bi bi-mortarboard-fill"></i></div>
            <span>ACCRA ED</span>
        </div>
        <a href="{% url 'dashboard' %}" class="nav-item-link"><i class="bi bi-grid-fill"></i> Dashboard</a>
        <a href="{% url 'mark_attendance' %}" class="nav-item-link"><i class="bi bi-calendar2-check-fill"></i> Mark Attendance</a>
        <a href="{% url 'generate_invoices' %}" class="nav-item-link active"><i class="bi bi-credit-card-2-front-fill"></i> Issue Invoices</a>
        
        <div class="mt-auto">
            <form method="POST" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit" class="btn btn-outline-light w-100 btn-sm rounded-2">
                    <i class="bi bi-box-arrow-left me-1"></i> Sign Out
                </button>
            </form>
        </div>
    </aside>

    <!-- Main Workspace -->
    <main class="workspace">
        <header class="top-bar">
            <div class="small text-muted">
                Billing <i class="bi bi-chevron-right mx-1 small"></i> <strong class="text-dark">Issue Invoices</strong>
            </div>
            <div class="fw-bold small">{{ user.email }} ({{ user.role }})</div>
        </header>

        <div class="content-area">
            <div class="panel-card">
                <div class="text-center mb-4">
                    <div class="d-inline-flex p-3 rounded-circle bg-primary bg-opacity-10 text-primary mb-2">
                        <i class="bi bi-receipt fs-3"></i>
                    </div>
                    <h4 class="fw-bold mb-1">Issue Bulk Fee Invoices</h4>
                    <p class="text-muted small">Create an invoice bill for all currently registered students.</p>
                </div>

                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted">Fee Title / Description</label>
                        <input type="text" name="title" class="form-control" placeholder="e.g. Semester 2 Tuition Fee" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted">Fee Amount (₹)</label>
                        <input type="number" step="0.01" name="amount" class="form-control" placeholder="25000.00" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label small fw-bold text-muted">Due Date</label>
                        <input type="date" name="due_date" class="form-control" required>
                    </div>

                    <button type="submit" class="btn btn-saas-primary w-100">
                        <i class="bi bi-send-check me-1"></i> Issue Invoices to All Students
                    </button>
                </form>
            </div>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
